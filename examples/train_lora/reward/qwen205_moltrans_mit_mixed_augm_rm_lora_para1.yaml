### model
model_name_or_path: /mnt/e/CheckPoints/ChemicalFactory/output/qwen205_moltrans_mit_mixed_augm_rlhf_sft_lora_para1
trust_remote_code: true

### method
stage: rm
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: qwen205_moltrans_mit_mixed_augm_dpo_lora_para1_data
template: qwen
cutoff_len: 2048
max_samples: 10000000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/rm_lora/qwen205_moltrans_mit_mixed_augm_rm_lora_para1
logging_steps: 100
save_steps: 500000000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
# eval_dataset: dpo_en_demo
# val_size: 0.1
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500

val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 1000


