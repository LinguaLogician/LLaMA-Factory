### model
model_name_or_path: /home/liangtao/Models/Qwen/Qwen2-0.5B
trust_remote_code: true
train_from_scratch: true

### model config
#attention_dropout: 0.0
#bos_token_id: 151643
#eos_token_id: 151643
#hidden_act: silu
#hidden_size: 896
#initializer_range: 0.02
#intermediate_size: 4864
#max_position_embeddings: 131072
#max_window_layers: 24
#model_type: qwen2
num_attention_heads: 16
#num_attention_heads: 14
num_hidden_layers: 12
#num_hidden_layers: 24
num_key_value_heads: 4
#num_key_value_heads: 2
#rms_norm_eps: 1e-06
#rope_scaling: null
#rope_theta: 1000000.0
#sliding_window: 131072
#tie_word_embeddings: true
#torch_dtype: float32
#transformers_version: 4.50.1
#use_cache: true
#use_sliding_window: false
#vocab_size: 151936

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: alpaca_en_demo
template: qwen
cutoff_len: 2048
max_samples: 100000000000
overwrite_cache: true
#data_sort_by: prompt_length
#shuffle: false
#preprocessing_num_workers: 16
preprocessing_num_workers: 1
dataloader_num_workers: 4

### output
output_dir: saves/sft_lora/modified_demo/
logging_steps: 100
save_steps: 20000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
#deepspeed: examples/deepspeed/ds_z2_offload_config.json

weight_decay: 1.0e-4


per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.02
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 100


run_name: modified_demo

