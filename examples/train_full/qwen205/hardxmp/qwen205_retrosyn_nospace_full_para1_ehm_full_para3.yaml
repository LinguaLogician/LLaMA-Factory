### model
model_name_or_path: /mnt/e/CheckPoints/ChemicalFactory/output/qwen205_retrosyn_nospace_full_para1_ehm_full_para2
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z2_config.json

### dataset
dataset: alpaca_retrosyn_nospace_train,retrosyn_train_split1_ht5,retrosyn_train_split2_ht5,retrosyn_train_split1_ht5_copy1,retrosyn_train_split2_ht5_copy1,retrosyn_train_split1_ht5_copy2,retrosyn_train_split2_ht5_copy2
template: qwen
cutoff_len: 2048
max_samples: 100000000000
overwrite_cache: true
preprocessing_num_workers: 1
dataloader_num_workers: 4

### output
output_dir: output/qwen205_retrosyn_nospace_full_para1_ehm_full_para3
logging_steps: 100
save_steps: 200000000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 4.0
lr_scheduler_type: warmup_stable_decay
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.1
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 4000


run_name: qwen205_retrosyn_nospace_full_para1_ehm_full_para3

