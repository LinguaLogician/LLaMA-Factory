### model
model_name_or_path: /home/liangtao/Models/Qwen/Qwen2-VL-2B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z2_offload_config.json

### dataset
dataset: sharegpt_chemicals_retrosyn_train
template: qwen2_vl
cutoff_len: 2048
max_samples: 100000000000000000000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: output/qwen2vl2_chemicals_retrosyn_full_para01
logging_steps: 10
save_steps: 50000000000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

## eval
val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500

run_name: qwen2vl2_chemicals_retrosyn_full_para01

# FORCE_TORCHRUN=1 llamafactory-cli train examples/train_full/qwen2vl2/qwen2vl2_chemicals_retrosyn_full_para01.yaml 2>&1 | tee -a logs/qwen2vl2_chemicals_retrosyn_full_para01.log
